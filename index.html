<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>X巡回アシスタント</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:620px;margin:auto;padding:24px 18px}h1{font-size:24px}small,.muted{color:#667085}.card{background:white;padding:20px;border-radius:18px;margin:14px 0;box-shadow:0 3px 16px #18233a0a}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #ccd2dd}button{background:#172033;color:white;cursor:pointer}button.secondary{background:#edf0f5;color:#172033}input{width:calc(100% - 26px)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border-top:1px solid #edf0f5;padding:14px 0}.item:first-child{border-top:0}.grow{flex:1}a{color:#1355a5}.tag{font-size:12px;color:#667085}#notice{font-size:13px}</style></head><body><main><h1>♡ X巡回アシスタント</h1><p class="muted">朝と夜、気になる投稿を確認するための個人用ツール</p><div class="card"><div class="row"><button onclick="start('朝')">☀ 朝の巡回</button><button onclick="start('夜')">☾ 夜の巡回</button></div><p id="session" class="muted">巡回を選んでください</p><p id="stats"></p></div><div class="card"><h2>対象を追加</h2><p class="muted">公開プロフィールのユーザー名を入力（@なしでも可）</p><input id="handle" placeholder="例：example_user" maxlength="30"><p><select id="kind"><option value="フォロー先">フォロー先</option><option value="フォロワー">フォロワー</option></select> <button onclick="add()">追加</button></p><p id="notice" class="muted">Xへのログイン情報は取得・保存しません。</p></div><div class="card"><div class="row"><h2 class="grow">巡回リスト</h2><button class="secondary" onclick="exportData()">記録を書き出す</button></div><div id="list"></div></div><p class="muted"><small>V0.2：投稿の自動取得・自動いいねは行いません。プロフィールを開いてX上で投稿を確認してください。記録はこの端末のブラウザ内に保存されます。ブラウザデータ削除で消えるため、必要に応じて書き出してください。</small></p></main><script>const KEY='x-patrol-v01';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{users:[],logs:[]}}catch{data={users:[],logs:[]}}let session='';const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};function start(s){session=s+' '+new Date().toLocaleString('ja-JP');document.getElementById('session').textContent='現在：'+session;render()}function add(){let h=document.getElementById('handle').value.trim().replace(/^@/,'');if(!/^[A-Za-z0-9_]{1,15}$/.test(h)){alert('Xのユーザー名を確認してください（英数字・_、15文字以内）');return}if(data.users.some(x=>x.h.toLowerCase()===h.toLowerCase())){alert('登録済みです');return}if(data.users.length>=100){alert('最大100人です');return}data.users.push({h,k:document.getElementById('kind').value});document.getElementById('handle').value='';save()}function mark(h){data.logs.push({h,at:new Date().toISOString(),session:session||'手動確認'});save()}function remove(h){if(confirm('@'+h+' を削除しますか？')){data.users=data.users.filter(x=>x.h!==h);save()}}function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='x-patrol-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){const today=new Date().toLocaleDateString('ja-JP');let count=data.logs.filter(l=>new Date(l.at).toLocaleDateString('ja-JP')===today).length;document.getElementById('stats').textContent=`登録 ${data.users.length}/100人 · 今日の確認 ${count}件`;const root=document.getElementById('list');root.replaceChildren();if(!data.users.length){root.textContent='まだ登録されていません。';return}for(const u of data.users){const d=document.createElement('div');d.className='item';const top=document.createElement('div');top.className='row';const label=document.createElement('strong');label.className='grow';label.textContent='@'+u.h+' · '+u.k;top.append(label);const link=document.createElement('a');link.href='https://x.com/'+encodeURIComponent(u.h);link.target='_blank';link.rel='noopener noreferrer';link.textContent='Xで開く ↗';top.append(link);d.append(top);const last=data.logs.filter(l=>l.h===u.h).at(-1);const p=document.createElement('p');p.className='tag';p.textContent=last?'最終確認：'+new Date(last.at).toLocaleString('ja-JP'):'未確認';d.append(p);const controls=document.createElement('div');controls.className='row';const b=document.createElement('button');b.textContent='確認済みにする';b.onclick=()=>mark(u.h);const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>remove(u.h);controls.append(b,del);d.append(controls);root.append(d)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
