<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>X巡回アシスタント V0.3</title><style>body{font:16px system-ui;background:#f5f7fb;color:#172033;margin:0}main{max-width:700px;margin:auto;padding:20px}h1{font-size:23px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #1720330a}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}button{background:#172033;color:white}input,select{max-width:100%;box-sizing:border-box}input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#667085;font-size:13px}.bar{height:7px;background:#e2e8f0;border-radius:9px}.bar>div{height:100%;background:#5476ca;border-radius:9px}.stat{background:#edf2f9;padding:10px;border-radius:10px;flex:1;text-align:center}.stat strong{display:block;font-size:22px}label{display:block;margin:12px 0 4px}a{color:#1559a3}.hidden{display:none}</style><main><h1>♡ X巡回アシスタント V0.3</h1><p class="muted">ジャンル自由編集・交流候補・朝夜巡回</p><div class="row" id="stats"></div><div class="row"><button data-page="genres">ジャンル</button><button data-page="people">交流候補</button><button data-page="patrol">朝夜巡回</button><button data-page="backup">バックアップ</button></div><section id="genres" class="card"><h2>ジャンル別候補人数</h2><div id="genreList"></div><h3>ジャンル追加</h3><form id="addGenre"><label>ジャンル名<input id="gname" maxlength="32" required></label><label>目標人数<input id="gtarget" type="number" min="1" max="100000" value="20" required></label><label>検索キーワード（カンマ区切り）<input id="gwords"></label><p><button>追加</button></p></form></section><section id="people" class="card hidden"><h2>交流候補</h2><label>ジャンル<select id="searchGenre"></select></label><label>検索キーワード<select id="keyword"></select></label><p><button id="searchX">Xで関連投稿を検索 ↗</button></p><h3>候補登録</h3><form id="addPerson"><label>Xユーザー名<input id="handle" placeholder="@example_user" required></label><label>ジャンル<select id="personGenre"></select></label><label>メモ<input id="note" maxlength="160"></label><p><button>候補を追加</button></p></form><label>表示ジャンル<select id="filterGenre"></select></label><div id="personList"></div></section><section id="patrol" class="card hidden"><h2>朝夜巡回</h2><p class="muted">プロフィールを開いて投稿を確認。いいねはXで手動操作します。</p><div class="row"><button id="morning">☀ 朝の巡回</button><button id="night">☾ 夜の巡回</button></div><p id="session"></p><div id="patrolList"></div></section><section id="backup" class="card hidden"><h2>データ保存</h2><p class="muted">この端末内に保存。端末変更前にJSONを保存してください。</p><button id="export">JSONバックアップ</button><label>JSON復元（既存データを置換）<input type="file" id="import" accept=".json,application/json"></label></section><p class="muted">Xの自動いいね・フォロワー自動取得は行いません。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='xpatrol-v03',states=['新規発見','興味あり','交流中','フォロー中','保留'];let d={genres:[{id:'g1',name:'サバゲー',target:30,words:['サバゲー','サバゲー初心者']},{id:'g2',name:'エアガン',target:30,words:['エアガン','愛銃紹介']},{id:'g3',name:'カスタム',target:20,words:['エアガンカスタム','外装カスタム']}],people:[]},session='';try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.genres)&&Array.isArray(x.people))d=x}catch(e){}const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert('保存できませんでした')}};const node=(tag,text)=>{let x=document.createElement(tag);x.textContent=text;return x},btn=(text,fn)=>{let b=node('button',text);b.type='button';b.onclick=fn;return b},words=s=>[...new Set(s.split(/[,、]/).map(x=>x.trim()).filter(Boolean))].slice(0,25);function options(id,items,all=false){const s=$(id),old=s.value;s.replaceChildren();if(all)s.add(new Option('すべて',''));items.forEach(g=>s.add(new Option(g.name,g.id)));if([...s.options].some(o=>o.value===old))s.value=old}function render(){const root=$('genreList');root.replaceChildren();d.genres.forEach(g=>{const count=d.people.filter(p=>p.genres.includes(g.id)).length,w=node('div','');w.className='item';w.append(node('strong',g.name+'：'+count+'人 / 目標'+g.target+'人（'+Math.round(count/g.target*100)+'%）'));const bar=node('div','');bar.className='bar';const fill=node('div','');fill.style.width=Math.min(100,count/g.target*100)+'%';bar.append(fill);w.append(bar,node('p','検索：'+g.words.join('、')));w.append(btn('編集',()=>{const name=prompt('ジャンル名',g.name);if(name===null)return;const target=prompt('目標人数',g.target);if(target===null)return;const ww=prompt('検索キーワード（カンマ区切り）',g.words.join(','));if(ww===null)return;if(!name.trim()||d.genres.some(x=>x!==g&&x.name===name.trim())||!Number.isInteger(+target)||+target<1||+target>100000)return alert('入力を確認してください');g.name=name.trim();g.target=+target;g.words=words(ww);save();render()}),btn('削除',()=>{if(!confirm('ジャンルを削除しますか？ 候補は未分類として残ります。'))return;d.genres=d.genres.filter(x=>x!==g);d.people.forEach(p=>p.genres=p.genres.filter(id=>id!==g.id));save();render()}));root.append(w)});$('stats').replaceChildren(...[['ジャンル',d.genres.length],['候補人数',d.people.length],['目標合計',d.genres.reduce((s,g)=>s+g.target,0)]].map(([n,v])=>{const x=node('div','');x.className='stat';x.append(node('strong',v),node('small',n));return x}));['searchGenre','personGenre','filterGenre'].forEach(id=>options(id,d.genres,id==='filterGenre'));updateWords();renderPeople();renderPatrol()}
function updateWords(){const g=d.genres.find(g=>g.id===$('searchGenre').value);$('keyword').replaceChildren(...(g?.words||[]).map(w=>new Option(w,w)))}$('searchGenre').onchange=updateWords;$('searchX').onclick=()=>{if(!$('keyword').value)return alert('検索キーワードを設定してください');window.open('https://x.com/search?q='+encodeURIComponent($('keyword').value)+'&f=live','_blank','noopener')};$('addGenre').onsubmit=e=>{e.preventDefault();const name=$('gname').value.trim(),target=+$('gtarget').value;if(!name||d.genres.some(g=>g.name===name)||!Number.isInteger(target)||target<1)return;d.genres.push({id:uid(),name,target,words:words($('gwords').value)});save();e.target.reset();render()};$('addPerson').onsubmit=e=>{e.preventDefault();const handle=$('handle').value.trim().replace(/^@/,'');if(!/^[a-zA-Z0-9_]{1,15}$/.test(handle))return alert('Xユーザー名を確認してください');const gid=$('personGenre').value;if(!gid)return alert('ジャンルを追加してください');let p=d.people.find(p=>p.handle.toLowerCase()===handle.toLowerCase());if(p){if(!p.genres.includes(gid))p.genres.push(gid)}else d.people.push({id:uid(),handle,genres:[gid],note:$('note').value.trim(),status:'新規発見',checked:''});save();e.target.reset();render()};$('filterGenre').onchange=renderPeople;
function renderPeople(){const root=$('personList');root.replaceChildren();d.people.filter(p=>!$('filterGenre').value||p.genres.includes($('filterGenre').value)).forEach(p=>{const x=node('div','');x.className='item';const a=node('a','@'+p.handle+' ↗');a.href='https://x.com/'+p.handle;a.target='_blank';a.rel='noopener noreferrer';x.append(a,node('p','ジャンル：'+(p.genres.map(id=>d.genres.find(g=>g.id===id)?.name).filter(Boolean).join('・')||'未分類')));const sel=node('select','');states.forEach(s=>sel.add(new Option(s,s)));sel.value=p.status;sel.onchange=()=>{p.status=sel.value;save()};x.append(sel,node('p','メモ：'+(p.note||'なし')+' / 最終確認：'+(p.checked||'なし')));x.append(btn('ジャンル追加',()=>{const g=d.genres.filter(g=>!p.genres.includes(g.id));if(!g.length)return alert('追加できるジャンルはありません');const name=prompt('追加するジャンル名：'+g.map(g=>g.name).join(' / '));const found=g.find(g=>g.name===name);if(found){p.genres.push(found.id);save();render()}}),btn('削除',()=>{if(!confirm('@'+p.handle+' を削除しますか？'))return;d.people=d.people.filter(x=>x!==p);save();render()}));root.append(x)})}
function renderPatrol(){const root=$('patrolList');root.replaceChildren();d.people.forEach(p=>{const x=node('div','');x.className='item';const a=node('a','@'+p.handle+' ↗');a.href='https://x.com/'+p.handle;a.target='_blank';a.rel='noopener noreferrer';x.append(a,node('span','　'+p.status+' / '+(p.checked||'未確認')));x.append(btn('確認済み',()=>{p.checked=new Date().toLocaleString('ja-JP')+(session?' '+session:'');save();render()}));root.append(x)})}for(const [id,name] of [['morning','朝'],['night','夜']])$(id).onclick=()=>{session=name;$('session').textContent=name+'の巡回：'+d.people.length+'人';renderPatrol()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden')});$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,...d},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='x-patrol-v03-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f||f.size>2000000)return alert('ファイルを確認してください');try{const v=JSON.parse(await f.text());if(!Array.isArray(v.genres)||!Array.isArray(v.people)||v.genres.some(g=>typeof g.id!=='string'||typeof g.name!=='string'||!Number.isInteger(g.target)||g.target<1||!Array.isArray(g.words))||v.people.some(p=>!Array.isArray(p.genres)||!/^[a-zA-Z0-9_]{1,15}$/.test(p.handle)||!states.includes(p.status)))throw Error('形式が違います');if(confirm('現在のデータをバックアップで置換しますか？')){d={genres:v.genres,people:v.people};save();render()}}catch(err){alert('読み込みできません：'+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></html>
